name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build the web app
        run: |
          set -o pipefail
          { npm ci && node tests/engine.test.mjs && npx vite build && npx cap sync android; } 2>&1 | tee "$RUNNER_TEMP/web.log"

      - name: Build the signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk ../ArkMode.apk
          cd .. && (cd dist && zip -qr ../web-bundle.zip .)

      - name: Report failure as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Build failed'; echo '```'; cat "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/gradle.log" 2>/dev/null | grep -v '^\s*$' | tail -n 120; echo '```'; } > report.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@report.md

      - name: Publish as a release (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ark Mode build ${{ github.run_number }}
          body: Install ArkMode.apk on your phone. Updates install over the old version and keep your data.
          files: |
            ArkMode.apk
            web-bundle.zip
          make_latest: true
